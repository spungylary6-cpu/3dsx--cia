name: Build CIA

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates file jq

      - name: Join game parts
        run: |
          INPUT=$(jq -r '.Input' info.json)
          cat game_part1.zip game_part2.zip game_part3.zip game_part4.zip > "$INPUT"
          echo "1b254016640edb78b5c88130a551328de75b4f687383905de738982a68621eec  $INPUT" | sha256sum -c -

      - name: Convert 3DSX to CIA
        run: |
          chmod +x cxitool makerom bannertool
          TID=$(jq -r '."Title-ID"' info.json)
          CODE=$(jq -r '."Product-Code"' info.json)
          BANNER=$(jq -r '.Banner' info.json)
          AUDIO=$(jq -r '.Bnr_audio' info.json)
          INPUT=$(jq -r '.Input' info.json)
          OUTPUT=$(jq -r '.Output' info.json)
          ./bannertool makebanner -i "$BANNER" -a "$AUDIO" -o banner.bnr
          ./cxitool -b banner.bnr -t "$TID" -c "$CODE" "$INPUT" temp.cxi
          ./makerom -f cia -o "$OUTPUT" -target t -i temp.cxi:0:0 -ignoresign
          rm -f temp.cxi banner.bnr

      - name: Upload CIA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cia-build
          path: ./*.cia
          if-no-files-found: error
          retention-days: 30
